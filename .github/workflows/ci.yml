name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin

    - name: Build Backend
      run: cd backend && mvn clean package --no-transfer-progress

    - name: Build Frontend
      run: |
        cd frontend
        npm ci
        npm run build
